# Minimal test config for groupmerge - run with: mango -c assets/test_groupmerge.conf

# Basics
blur=0
shadows=0
border_radius=0
focused_opacity=1.0
unfocused_opacity=1.0
animations=0
no_border_when_single=0
sloppyfocus=1
warpcursor=1

# Appearance
borderpx=2
gappih=5
gappiv=5
gappoh=10
gappov=10
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0xc9b890ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff

# Group bar (must be >0 to see groups)
group_bar_height=30
group_bar_decorate_fg_color=0xffffffff
group_bar_decorate_bg_color=0x333333ff
group_bar_decorate_focus_fg_color=0x00ff00ff
group_bar_decorate_focus_bg_color=0x555555ff
group_bar_decorate_font_desc=monospace Bold 12

# Layout
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Keyboard
repeat_rate=25
repeat_delay=600
xkb_rules_layout=us

# --- Bindings (ALT for nested) ---

# reload config
bind=SUPER,r,reload_config

# spawn terminal
bind=ALT,Return,spawn,foot

# kill
bind=ALT,q,killclient,

# focus direction
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# groupjoin (push focused window into neighbor)
bind=ALT+SHIFT,Left,groupjoin,left
bind=ALT+SHIFT,Right,groupjoin,right
bind=ALT+SHIFT,Up,groupjoin,up
bind=ALT+SHIFT,Down,groupjoin,down

# groupmerge (pull neighbor into focused window)
bind=ALT+CTRL,Left,groupmerge,left
bind=ALT+CTRL,Right,groupmerge,right
bind=ALT+CTRL,Up,groupmerge,up
bind=ALT+CTRL,Down,groupmerge,down

group_capture_spawn=1

# groupleave
bind=ALT+CTRL+SHIFT,q,groupleave

# groupfocus (cycle within group)
bind=ALT,g,groupfocus,next
bind=ALT+SHIFT,g,groupfocus,prev

# toggle floating
bind=ALT,space,togglefloating

# tag switch (for testing cross-tag)
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0

# Mouse
mousebind=ALT,btn_left,moveresize,curmove
mousebind=ALT,btn_right,moveresize,curresize
